[package]
name = "seagents"
version = "0.1.0"
edition = "2021"
description = "run coding agents in herdr, each in its own i3 window"
license = "Apache-2.0"
keywords = ["i3", "herdr", "claude-code", "codex", "agents"]
categories = ["command-line-utilities"]

[[bin]]
name = "seagents"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
crossterm = "0.28"
signal-hook = "0.3"
libc = "0.2"
serde_json = "1"
sha2 = "0.10"
ratatui = "0.28"
clap = { version = "4", features = ["derive"] }
