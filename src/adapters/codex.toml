# Codex CLI — how seagents launches and drives it. Bundled default; a copy
# at ~/.config/seagents/agents/codex.toml replaces this file whole. Facts
# measured on codex-cli 0.152.0 (2026-09-29), live in tmux.

[launch]
# `codex [PROMPT]` starts the interactive TUI and submits the prompt as the
# first turn; clap takes `--`, so a prompt starting with `-` stays a prompt
# (verified).
seed_prompt      = ["--", "{prompt}"]
# Codex has no permission-mode flag: an approval policy (-a) and a sandbox
# (-s) instead, mapped from Claude's mode words under
# [launch.permission_argv] — those words because Codex's hooks report a
# parent's mode in them, so a Claude parent and a Codex parent bound their
# children alike.
permission_modes = ["plan", "default", "acceptEdits", "bypassPermissions"]
identity         = "hook"
turns            = "hook"
watch_dir        = ""
# What Codex sets for the commands it runs (read off `env` inside a shell
# tool call, and its source): the thread's identity, its sandbox and
# approval state. Never CODEX_HOME, the user's own configuration.
session_env      = [
  "CODEX_CI",
  "CODEX_SESSION_ID",
  "CODEX_THREAD_ID",
  "CODEX_PERMISSION_PROFILE",
  "CODEX_SANDBOX",
  "CODEX_SANDBOX_NETWORK_DISABLED",
  "CODEX_NETWORK_PROXY_ACTIVE",
  "CODEX_ESCALATE_SOCKET",
]

# `-a` takes on-request | never (0.152 refuses untrusted/on-failure); `-s`
# read-only | workspace-write | danger-full-access. What the hooks then
# report as `permission_mode` (measured, every pair, 2026-09-29) follows the
# approval policy alone: on-request → "default", never →
# "bypassPermissions", whatever the sandbox (and no flags, the configured
# on-request, → "default"). So nothing short of bypass may use `-a never`:
# its child would read as bypass and its own children inherit that.
# No mode has an exact twin, and each takes the nearest that is not more
# privileged:
#   plan, default — read-only sandbox; any write, and anything the sandbox
#     stops, is an approval request to a human, as Claude's edits are in
#     `default` and leaving plan mode is in `plan`.
#   acceptEdits — the workspace is writable without asking (commands run
#     sandboxed to it, no network); leaving it asks.
#   bypassPermissions — no approvals, no sandbox.
[launch.permission_argv]
plan              = ["-a", "on-request", "-s", "read-only"]
default           = ["-a", "on-request", "-s", "read-only"]
acceptEdits       = ["-a", "on-request", "-s", "workspace-write"]
bypassPermissions = ["-a", "never", "-s", "danger-full-access"]

[hooks]
# Codex's hooks are Claude's (same events, same payload fields, and
# `transcript_path` is the rollout file), configured under `[hooks]` in
# config.toml — and in a `-c` override, which Codex keeps as its own
# "session flags" layer beside the user's config. A hook runs only once
# trusted: `hooks.state."<source>:<event>:<group>:<handler>".trusted_hash`,
# a sha256 of the hook's normalized definition, which the same override may
# carry for the hooks it adds. So `run` passes one `-c hooks={…}` holding
# its hooks and their trust, and nothing under ~/.codex is written.
inject           = "config"
flags            = ["-c", "--config"]
events           = ["SessionStart", "UserPromptSubmit", "Stop"]
hookless_flags   = []

[send]
submit_delay_ms  = 300
pre_send         = ""
# Exits at once (verified; `/quit` too).
exit_sequence    = "/exit"
# Every paste is taken as the user's words: a bracketed paste of 4,392
# chars on 31 lines shows as `[Pasted Content 4392 chars]` in the composer
# and is submitted whole — the UserPromptSubmit `prompt` and the rollout's
# user message hold all of it, and the model acted on its last line.
long_prompt      = "paste"

[read]
# The rollout JSONL under $CODEX_HOME/sessions/YYYY/MM/DD/, path reported by
# the hooks. Also where an Esc's `turn_aborted` record is.
transcript       = "codex"

[restore]
# `codex resume <id> …` — the subcommand takes every option the TUI does,
# and a `-c` before it still applies (verified: our hooks fire in a
# resumed session, SessionStart source `resume`).
resume           = ["resume", "{session}"]
drop             = ["resume", "fork", "--last"]
