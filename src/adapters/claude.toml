# Claude Code — how seagents launches and drives it. Bundled default; a copy
# at ~/.config/seagents/agents/claude.toml replaces this file whole.

[launch]
# Appended to the child's argv (never to the argv recorded in .meta). After
# `--`, so a prompt starting with `-` is never parsed as a flag; interactive
# mode still submits it (verified 2026-09-29).
seed_prompt      = ["--", "{prompt}"]
# Least to most privileged; each one's argv is under [launch.permission_argv].
permission_modes = ["plan", "default", "acceptEdits", "bypassPermissions"]
identity         = "hook"
turns            = "hook"
watch_dir        = ""
# What a running Claude Code sets for its children: its session's identity
# and messaging socket/token. A window launched from inside one (an agent
# calling `spawn`) must not inherit them — with them, a Claude started
# outside tmux never writes its transcript (bisected 2026-09-29), and the
# socket and token are that session's alone. Listed one by one: the user's
# own configuration (CLAUDE_CONFIG_DIR, CLAUDE_CODE_USE_BEDROCK,
# CLAUDE_CODE_MAX_OUTPUT_TOKENS, …) must pass through.
session_env      = [
  "CLAUDECODE",
  "CLAUDE_CODE_ENTRYPOINT",
  "CLAUDE_CODE_MESSAGING_SOCKET",
  "CLAUDE_CODE_MESSAGING_TOKEN",
  "CLAUDE_CODE_EXECPATH",
  "CLAUDE_CODE_SESSION_ID",
  "CLAUDE_CODE_CHILD_SESSION",
  "CLAUDE_CODE_SESSION_ATTENDED",
  "CLAUDE_PID",
  "CLAUDE_EFFORT",
  "AI_AGENT",
]

[launch.permission_argv]
plan              = ["--permission-mode", "plan"]
default           = ["--permission-mode", "default"]
acceptEdits       = ["--permission-mode", "acceptEdits"]
bypassPermissions = ["--permission-mode", "bypassPermissions"]

[hooks]
# One --settings JSON carrying the hooks. Repeated --settings flags replace
# each other (verified 2026-09-28), so `run` merges a user's own into one.
inject           = "settings"
flags            = ["--settings"]
events           = ["SessionStart", "UserPromptSubmit", "Stop"]
# `--bare` skips hooks, so nothing is injected under it.
hookless_flags   = ["--bare"]

[send]
submit_delay_ms  = 300
pre_send         = ""
exit_sequence    = "/exit"
# A paste Claude Code (2.1.284) takes as the user's words lands in its
# transcript inline; a longer one is wrapped in <pasted_content>, which the
# model treats as data that may carry instructions the user did not write, and
# can decline to act on. Measured with bracketed paste + 300 ms + Enter: one
# line of 700 chars and 2 short lines stay inline; 900 chars on one line, or
# 7 short lines, are wrapped. So past either limit the body is written to
# <cwd>/.seagents/prompts/ and the agent is sent one line telling it to read
# the file — a Read inside its cwd needs no permission, in any mode
# (verified in `default`, 2026-09-29). A seed prompt on the command line is
# never wrapped (verified: 50 lines, ~5000 chars), so seeds stay as they are.
long_prompt      = "file"
inline_max_chars = 700
inline_max_lines = 2

[read]
# JSONL under $CLAUDE_CONFIG_DIR/projects, path reported by the hooks. Also
# where the turn ledger finds an Esc's interrupt record.
transcript       = "claude"

[restore]
# `claude --resume <id> …`; a stale --resume/-r/--continue/-c the window was
# first launched with goes, or it would fight the captured conversation.
resume           = ["--resume", "{session}"]
drop             = ["--resume", "-r", "--continue", "-c"]
