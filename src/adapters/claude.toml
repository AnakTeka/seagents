# Claude Code — how seagents launches and drives it. Bundled default; a copy
# at ~/.config/seagents/agents/claude.toml replaces this file whole.

[launch]
# Appended to the child's argv (never to the argv recorded in .meta). After
# `--`, so a prompt starting with `-` is never parsed as a flag; interactive
# mode still submits it (verified 2026-09-29).
seed_prompt      = ["--", "{prompt}"]
# How hooks are injected. Repeated --settings flags replace each other
# (verified 2026-09-28), so `run` merges into one.
settings_flag    = "--settings"
# `--bare` skips hooks, so nothing is injected under it.
hookless_flags   = ["--bare"]
permission_flag  = "--permission-mode"
# Least to most privileged.
permission_modes = ["plan", "default", "acceptEdits", "bypassPermissions"]
identity         = "hook"
turns            = "hook"
watch_dir        = ""

[send]
submit_delay_ms  = 300
pre_send         = ""
exit_sequence    = "/exit"
