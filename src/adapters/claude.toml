# Claude Code — how seagents launches and drives it. Bundled default; a copy
# at ~/.config/seagents/agents/claude.toml replaces this file whole.

[launch]
# What a running Claude Code sets for its children: its session's identity
# and messaging socket/token. A window launched from inside one (an agent
# calling `spawn`, or a herdr server it starts) must not inherit them — with
# them, a Claude started outside tmux never writes its transcript (bisected
# 2026-09-29), and the socket and token are that session's alone. Listed one
# by one: the user's own configuration (CLAUDE_CONFIG_DIR,
# CLAUDE_CODE_USE_BEDROCK, CLAUDE_CODE_MAX_OUTPUT_TOKENS, …) must pass
# through.
session_env      = [
  "CLAUDECODE",
  "CLAUDE_CODE_ENTRYPOINT",
  "CLAUDE_CODE_MESSAGING_SOCKET",
  "CLAUDE_CODE_MESSAGING_TOKEN",
  "CLAUDE_CODE_EXECPATH",
  "CLAUDE_CODE_SESSION_ID",
  "CLAUDE_CODE_CHILD_SESSION",
  "CLAUDE_CODE_SESSION_ATTENDED",
  "CLAUDE_PID",
  "CLAUDE_EFFORT",
  "AI_AGENT",
]

# What `spawn --permission-mode` takes, and the argv for each.
[launch.permission_argv]
plan              = ["--permission-mode", "plan"]
default           = ["--permission-mode", "default"]
acceptEdits       = ["--permission-mode", "acceptEdits"]
bypassPermissions = ["--permission-mode", "bypassPermissions"]

[hooks]
# One --settings carrying the hooks. Repeated --settings flags replace each
# other (verified 2026-09-28), so `run` merges a user's own into one — and
# passes it as a path, to a 0600 file in the runtime dir, since herdr types
# the agent's command line into the pane's shell (and its history).
inject           = "settings"
flags            = ["--settings"]
events           = ["SessionStart", "UserPromptSubmit", "Stop"]
# `--bare` skips hooks, so nothing is injected under it.
hookless_flags   = ["--bare"]

[send]
# A paste Claude Code (2.1.284) takes as the user's words lands in its
# transcript inline; a longer one is wrapped in <pasted_content>, which the
# model treats as data that may carry instructions the user did not write, and
# can decline to act on. Measured with bracketed paste + 300 ms + Enter (what
# herdr's `agent prompt` sends): one line of 700 chars and 2 short lines stay
# inline; 900 chars on one line, or 7 short lines, are wrapped. So past either
# limit the body is written to <cwd>/.seagents/prompts/ and the agent is sent
# one line telling it to read the file — a Read inside its cwd needs no
# permission, in any mode (verified in `default`, 2026-09-29). A seed prompt
# always goes this way.
long_prompt      = "file"
inline_max_chars = 700
inline_max_lines = 2
# The input box: the row starting with `❯` (the dim placeholder `Try "…"`
# when empty) and the rows under it, between two rules. A prompt Esc'd
# before its first response is put back there, and a human may have a draft
# in it; a paste would land after either (verified: one prompt `…about the
# seaReply with exactly: …`). Ctrl+U deletes to the start of the line, and
# at a line's start the newline before it (so a box of N lines empties in
# 2N-1 presses, the cursor at its end). Never Ctrl+C: on an empty box it
# starts exiting.
input_glyph      = "❯"
input_clear      = ["ctrl+u"]

[stop]
exit_sequence    = "/exit"

[read]
# JSONL under $CLAUDE_CONFIG_DIR/projects, path reported by the hooks. Also
# where the turn ledger finds an Esc's interrupt record.
transcript       = "claude"

[restore]
# `claude --resume <id> …`; a stale --resume/-r/--continue/-c the window was
# first launched with goes, or it would fight the captured conversation.
resume           = ["--resume", "{session}"]
drop             = ["--resume", "-r", "--continue", "-c"]
